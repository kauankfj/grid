<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE</title>
    <style>
        .container{
            background-color: rgb(255, 0, 0);
            height: 700px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            justify-content: center;
            align-items: center;

        }
        .card{
            background-color: blanchedalmond;
            height: 200px;

        }

        @media (max-width:800px){
            .card{
                background-color: rgb(153, 83, 245);
                font-size: xx-large;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">kauan</div>
        <div class="card">kauan</div>
        <div class="card">kauan</div>
        <div class="card">kauan</div>
        <div class="card">kauan</div>
        <div class="card">kauan</div>
    </div>
</body>
</html>
